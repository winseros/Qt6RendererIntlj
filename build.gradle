import org.jetbrains.intellij.platform.gradle.TestFrameworkType
import org.jetbrains.intellij.platform.gradle.tasks.PrepareSandboxTask
import org.jetbrains.intellij.platform.gradle.Constants.Tasks

plugins {
    id "java"
    id "org.jetbrains.intellij.platform" version "2.10.5"
}

group = "n.v.k"
version = hasProperty("buildVersion") ? buildVersion : "1.0-SNAPSHOT"

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        bundledPlugin "com.intellij.clion"
        bundledPlugin "com.intellij.modules.cidr.debugger"
        testFramework TestFrameworkType.Platform.INSTANCE
    }
}

if (hasProperty("clionLocalSandbox")) {
    logger.lifecycle "Using sandbox IDE at: ${clionLocalSandbox}"
    dependencies.intellijPlatform.local clionLocalSandbox
} else {
    def targetIdeVersion = "2022.3"
    logger.lifecycle "Using the downloaded IDE: ${targetIdeVersion}"
    dependencies.intellijPlatform.clion targetIdeVersion
}

intellijPlatform {
    buildSearchableOptions = false

    pluginConfiguration {
        id = "${project.group}.${project.name}"
        name = "Qt6 Renderer"

        description = """<pre>
        The plugin for pretty printing Qt types by CLion debugger.
        <br>
        <uL>
            <li>Supported Qt versions: 6.x.</li>
            <li>Supported platforms: Windows, Linux.</li>
            <li>Supported architectures: X64.</li>
            <li>Supported debuggers: GDB, LLDB.</pre></li>
        </ul>
        """.stripIndent()

        changeNotes = """
        <strong>1.2.0</strong>
        <ul>
            <li>QJson support for LLDB</li>
            <li>Render bug fixes</li>
        </ul>        
        <strong>1.1.1</strong>
        <ul>
            <li>Minor render bug fixes</li>
        </ul>        
        <strong>1.1.0</strong>
        <ul>
            <li>GDB support</li>
            <li>LLDB code rewritten</li>
        </ul>
        <strong>1.1.0</strong>
        <ul>
            <li>GDB support</li>
            <li>LLDB code rewritten</li>
        </ul>
        <strong>1.0.0</strong>        
        <ul>
            <li>Initial version</li>
        </ul>
        """.stripIndent()

        ideaVersion {
            sinceBuild = "223" //https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html#platformVersions
        }

        vendor {
            name = "Nikita Kobzev"
            email = "win.accuracy@gmail.com"
            url = "https://github.com/winseros"
        }
    }
}

tasks.named(Tasks.PREPARE_SANDBOX, PrepareSandboxTask) {
    from(project.layout.projectDirectory.dir("qt6renderer/python/")) {
        include "**/*.py"
        into pluginName.map { "${it}/python" }
        preserve {
            include "**/*"
        }
    }
}